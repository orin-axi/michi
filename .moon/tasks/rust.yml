# Global tasks inherited by every Rust crate in the workspace.
tasks:
  build:
    script: "cargo build -p $MOON_PROJECT_ID --all-features"
    inputs:
      - "src/**/*"
      - "Cargo.toml"

  test:
    script: "cargo test -p $MOON_PROJECT_ID --all-features"
    inputs:
      - "src/**/*"
      - "tests/**/*"
      - "Cargo.toml"

  lint:
    script: "cargo clippy -p $MOON_PROJECT_ID --all-targets --all-features -- -D warnings"
    inputs:
      - "src/**/*"
      - "tests/**/*"
      - "Cargo.toml"

  format:
    script: "cargo fmt -p $MOON_PROJECT_ID"
    inputs:
      - "src/**/*"
      - "tests/**/*"
      - "Cargo.toml"

  format-check:
    script: "cargo fmt -p $MOON_PROJECT_ID -- --check"
    inputs:
      - "src/**/*"
      - "tests/**/*"
      - "Cargo.toml"

  check-wasm:
    script: "cargo check -p $MOON_PROJECT_ID --target wasm32-unknown-unknown"
    inputs:
      - "src/**/*"
      - "Cargo.toml"

  audit:
    script: "cargo deny check advisories"
    inputs:
      - "Cargo.lock"
      - "Cargo.toml"

  publish:
    script: "cargo publish -p $MOON_PROJECT_ID --no-verify"
    inputs:
      - "src/**/*"
      - "Cargo.toml"
