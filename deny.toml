[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "Zlib",
    # All crates in this workspace are intentionally source-available under
    # FSL-1.1-MIT. Michi has no permissive-core layer yet; if one is
    # designated later, see Lumen's deny.toml for the containment pattern
    # that keeps FSL-licensed code from leaking into a permissive crate.
    "FSL-1.1-MIT",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { name = "criterion", reason = "CLAUDE.md: benchmarks use divan, not criterion" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
