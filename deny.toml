[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "Zlib",
]
# AGPL is our own license, but under `version = 2` any license not in `allow`
# (or `exceptions`) is denied by default, so AGPL-3.0-or-later dependencies
# are already rejected without a separate `deny` list (that key was removed).
# The workspace's own crate is AGPL-licensed on purpose, so it needs an
# explicit exception; everything else stays denied. packages/michi-node is
# `publish = false`, so cargo-deny doesn't license-check it — no exception needed.
exceptions = [{ allow = ["AGPL-3.0-or-later"], crate = "michi" }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
