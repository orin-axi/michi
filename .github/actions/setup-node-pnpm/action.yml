name: 'Setup node & pnpm via proto'
description: >-
  Installs node/pnpm from .prototools via proto and caches the pnpm store for
  packages/michi-node. Single source of truth for this block -- it used to be
  copy-pasted across four jobs in two workflow files, which is exactly how
  michi ended up with three different pnpm versions pinned simultaneously.
inputs:
  cache:
    description: 'Whether to cache the pnpm store (skip for jobs that never run pnpm install)'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - uses: moonrepo/setup-toolchain@v0
    - shell: bash
      run: proto install node && proto install pnpm
    - name: Get pnpm store directory
      if: inputs.cache == 'true'
      id: pnpm-cache
      shell: bash
      working-directory: packages/michi-node
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - name: Cache pnpm store
      if: inputs.cache == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('packages/michi-node/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
