$schema: "https://moonrepo.dev/schemas/project.json"

language: typescript

tasks:
  publish:
    script: "echo 'michi-node npm publish not yet configured'"

  build:
    script: "just build-node"
    inputs:
      - "src/**/*"
      - "__test__/**/*"
      - "package.json"
      - "Cargo.toml"
      - "/src/**/*"
      - "/crates/**/*"
      - "/Cargo.toml"
      - "/Cargo.lock"
  test:
    script: "just test-node"
    inputs:
      - "index.js"
      - "index.d.ts"
      - "__test__/**/*"
      - "package.json"
      - "/src/**/*"
      - "/crates/**/*"
    deps:
      - build
