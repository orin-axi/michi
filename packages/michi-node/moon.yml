$schema: "https://moonrepo.dev/schemas/project.json"

language: typescript

tasks:
  build:
    command: just build-node
    inputs:
      - "src/**/*"
      - "__test__/**/*"
      - "package.json"
  test:
    command: just test-node
    inputs:
      - "index.js"
      - "index.d.ts"
      - "__test__/**/*"
      - "package.json"
    deps:
      - build
