$schema: "https://moonrepo.dev/schemas/project.json"

language: typescript

tasks:
  publish:
    script: "echo 'michi-node npm publish not yet configured'"

  build:
    command: just build-node
    inputs:
      - "src/**/*"
      - "__test__/**/*"
      - "package.json"
  test:
    command: just test-node
    inputs:
      - "index.js"
      - "index.d.ts"
      - "__test__/**/*"
      - "package.json"
    deps:
      - build
