[workspace]
members  = [".", "packages/michi-node"]
resolver = "2"

[workspace.package]
edition      = "2021"
rust-version = "1.96"
license      = "AGPL-3.0-or-later"
repository   = "https://github.com/orin-axi/michi"
authors      = ["orin-axi"]

[workspace.dependencies]
thiserror = "2"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
debug    = true

[package]
name        = "michi"
version     = "0.1.0"
description = "AXI response primitives for agent-ergonomic tools"
readme      = "README.md"
keywords    = ["axi", "agent", "mcp", "cli", "llm"]
categories  = ["text-processing", "encoding", "development-tools"]
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[features]
default = []
napi    = ["dep:napi", "dep:napi-derive", "dep:serde_json"]
serde   = ["dep:serde", "dep:serde_json"]

[dependencies]
thiserror.workspace = true

# napi feature
napi        = { version = "3", features = ["napi6", "serde-json"], optional = true }
napi-derive = { version = "3", optional = true }
serde_json  = { version = "1", optional = true, features = ["preserve_order"] }

# serde feature
serde      = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
divan    = "0.1"
proptest = "1"
insta    = { version = "1", features = ["yaml"] }

[[bench]]
name    = "toon_render"
harness = false

[[bench]]
name    = "kv_render"
harness = false
